services:
  - class: org.yamcs.archive.XtceTmRecorder
  - class: org.yamcs.archive.ParameterRecorder
  - class: org.yamcs.archive.AlarmRecorder
  - class: org.yamcs.archive.EventRecorder
  - class: org.yamcs.archive.ReplayServer
  - class: org.yamcs.plists.ParameterListService
  - class: org.yamcs.parameter.SystemParametersService
    args:
      producers: ['jvm', 'fs']
  - class: org.yamcs.ProcessorCreatorService
    args: 
      name: "realtime"
      type: "realtime" 
  - class: org.yamcs.archive.CommandHistoryRecorder
  - class: org.yamcs.parameterarchive.ParameterArchive
  - class: org.yamcs.simulator.SimulatorCommander
    args:
      type: pus
      tctm:
        tmPort: 10015
        tcPort: 10025
  - class: org.yamcs.cfdp.CfdpService
    name: cfdp0
    args:
     sequenceNrLength: 4
     maxPduSize: 512
     incomingBucket: "cfdpDown"
     eofAckTimeout: 3000
     eofAckLimit: 5
     #Note that the simulator does not process commands faster than 1/second.
     # Decreasign this number will make the packets queue up in the TCP queue
     # and the CFDP sender will timeout waiting for the EOF ACK
     sleepBetweenPdus: 1000
     localEntities:
       - name: default
         id: 11
         bucket: bucket1
       - name: id2
         id: 12
         bucket: bucket2
     remoteEntities:
       - name: default
         id: 5
       - name: target2
         id: 7
     senderFaultHandlers:
       AckLimitReached: suspend
  # Ground model of the on-board PUS ST[11] time-based schedule: plan commands at any time,
  # synchronise them with the on-board schedule at AOS, follow their execution from the
  # PUS ST[1] reports (realtime and dumped after LOS).
  - class: org.yamcs.obsched.OnboardSchedulerService
    name: obsched
    args:
      adapter: pus11
      adapterArgs:
        realtimeStream: tm_realtime
        dumpStreams: [tm_dump]
        # same as the pus11 defaults of the command post-processor
        defaultSubScheduleId: 1
        defaultGroupId: 1
  - class: org.yamcs.pus.PusEventDecoder
    args: 
        eventIdParameter: /PUS5/event_id
        eventTemplateFile: etc/events.json

dataLinks:
  - name: tm_realtime
    class: org.yamcs.tctm.TcpTmDataLink
    stream: tm_realtime
    host: localhost
    port: 10015
    # Give the embedded simulator some time to start up
    initialDelay: 2000
    packetPreprocessorClassName: org.yamcs.pus.PusPacketPreprocessor
    packetPreprocessorArgs:
        errorDetection:
           type: CRC-16-CCIIT
        timeEncoding:
           type: CUC
           epoch: UNIX

  # Packets stored on-board during LOS (ST[15] packet store) and downlinked after AOS on the simulator LOS port
  # (automatically at AOS or following a TC[15,9]). They are archived but not processed by the realtime processor.
  - name: tm_dump
    class: org.yamcs.tctm.TcpTmDataLink
    stream: tm_dump
    host: localhost
    port: 10115
    initialDelay: 2000
    packetPreprocessorClassName: org.yamcs.pus.PusPacketPreprocessor
    packetPreprocessorArgs:
        errorDetection:
           type: CRC-16-CCIIT
        timeEncoding:
           type: CUC
           epoch: UNIX

  - name: tc_realtime
    class: org.yamcs.tctm.TcpTcDataLink
    stream: tc_realtime
    host: localhost
    port: 10025
    # Give the embedded simulator some time to start up
    initialDelay: 2000
    commandPostprocessorClassName: org.yamcs.pus.PusCommandPostprocessor
    commandPostprocessorArgs:
        errorDetection:
            type: CRC-16-CCIIT
        timeEncoding:
            implicitPfield: false
            pfield: 0x2f
        pus11:
            subScheduleId:
                bytes: 1
                default: 1
            groupId:
                bytes: 1
                default: 1
        pus22:
            subScheduleId:
                bytes: 1
                default: 1
            groupId:
                bytes: 1
                default: 1

mdb:
  # Configuration of the active loaders
  # Valid loaders are: sheet, xtce or fully qualified name of the class
  - type: "xtce"
    spec: "mdb/dt.xml"
  - type: "xtce"
    spec: "mdb/pus.xml"
  - type: "xtce"
    spec: "mdb/pus5.xml"
  - type: "xtce"
    spec: "mdb/pus15.xml"
  - type: "xtce"
    spec: "mdb/pus11.xml"
  - type: "xtce"
    spec: "mdb/pus17.xml"
  - type: "xtce"
    spec: "mdb/pus19.xml"
  - type: "xtce"
    spec: "mdb/pus20.xml"
  - type: "xtce"
    spec: "mdb/pus22.xml"
  - type: "xtce"
    spec: "mdb/landing.xml"

#Configuration for streams created at server startup
streamConfig:
  tm:
    - name: "tm_realtime"
      processor: "realtime"
    - name: "tm_dump"
  invalidTm: "invalid_tm_stream"
  cmdHist: ["cmdhist_realtime", "cmdhist_dump"]
  event: ["events_realtime", "events_dump"]
  param: ["pp_realtime", "sys_param", "proc_param"]
  parameterAlarm: ["alarms_realtime"]
  eventAlarm: ["event_alarms_realtime"]
  tc: 
    - name: "tc_realtime"
      processor: "realtime"
  sqlFile: "etc/extra_streams.sql"